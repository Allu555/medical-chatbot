# =============================================================================
# Training Configuration — QLoRA Fine-tuning
# =============================================================================

model:
  base_model_name: "google/medgemma-4b-it"
  max_seq_length: 1024
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"   # auto-fallback to float16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  # target_modules are auto-detected at runtime

dataset:
  hf_dataset_name: "ruslanmv/ai-medical-chatbot"
  processed_dir: "data/processed"
  train_dir: "data/train"
  validation_dir: "data/validation"
  test_dir: "data/test"
  seed: 42
  train_ratio: 0.80
  validation_ratio: 0.10
  test_ratio: 0.10
  max_examples: 50000   # cap to keep training manageable; set null for all

training:
  output_dir: "artifacts/checkpoints"
  final_model_dir: "artifacts/model"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "paged_adamw_8bit"
  fp16: false               # auto-detected at runtime
  bf16: true                # auto-detected at runtime
  gradient_checkpointing: true
  dataloader_num_workers: 0
  logging_steps: 25
  eval_strategy: "steps"
  eval_steps: 200
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: "none"          # or "wandb" if configured
  ddp_find_unused_parameters: false
  group_by_length: true
  neftune_noise_alpha: 5     # helps generalisation; set null to disable

system_prompt: >
  You are a medical AI assistant providing educational health information.
  You always distinguish general information from personalised medical advice.
  You never invent medical facts, medications, dosages, or citations.
  You clearly express uncertainty when the evidence is limited.
  You always recommend that users seek professional medical care for diagnosis
  and treatment, and for emergencies you direct them to emergency services
  immediately.
